<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FCSAPI Chart - Full Configuration Example</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: Arial, sans-serif;
            background: #0d0e14;
            color: #d1d4dc;
            height: 100%;
            overflow: hidden;
        }
    </style>

    <!-- Load from GitHub CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fcsapi/chart-js/src/fcsapi-chart.css">


    <style>
        /* Tradigy V1 — Vertical Zoom controls */
        .fcsapi-chart-area {
            position: relative;
        }
        .tradigy-vertical-zoom {
            position: absolute;
            right: 10px;
            bottom: 34px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 2px;
            border-radius: 5px;
            background: rgba(20, 22, 30, 0.78);
            border: 1px solid rgba(120, 123, 134, 0.28);
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,.18);
            font-size: 12px;
            line-height: 1;
            user-select: none;
        }
        .tradigy-vertical-zoom button {
            width: 23px;
            height: 23px;
            padding: 0;
            border: 0;
            border-radius: 3px;
            background: transparent;
            color: #d1d4dc;
            cursor: pointer;
            font: 600 13px/23px Arial, sans-serif;
        }
        .tradigy-vertical-zoom button:hover {
            background: rgba(255,255,255,.10);
        }
        .tradigy-vertical-zoom button.active {
            background: rgba(41,98,255,.78);
            color: #fff;
        }
        .tradigy-vertical-zoom .vz-sep {
            width: 1px;
            height: 15px;
            background: rgba(255,255,255,.18);
            margin: 0 1px;
        }
    </style>
</head>
<body>
        <div id="fcs_chartparent">
            <div id="fcs_chart"></div>
            <div class="tradigy-vertical-zoom" id="tradigyVerticalZoom" aria-label="Vertical Zoom">
                <button type="button" id="vzUp" title="Zoom In" aria-label="Vertical Zoom In">▲</button>
                <button type="button" id="vzDown" title="Zoom Out" aria-label="Vertical Zoom Out">▼</button>
                <span class="vz-sep"></span>
                <button type="button" id="vzAuto" title="Auto Scale" aria-label="Auto Scale">A</button>
                <button type="button" id="vzLock" title="Lock Vertical Scale" aria-label="Lock Vertical Scale">L</button>
            </div>
        </div>

    <!-- Load from GitHub CDN -->
    <script src="https://cdn.jsdelivr.net/gh/fcsapi/chart-js/src/fcsapi-chart.js"></script>

    <script>
        // Mobile viewport height fix - for browsers without dvh support
        function setMobileHeight() {
            const vh = window.innerHeight;
            document.getElementById('fcs_chartparent').style.height = vh + 'px';
        }
        setMobileHeight();
        window.addEventListener('resize', setMobileHeight);

        // ============================================================
        // FCSAPI CHART - FULL CONFIGURATION OPTIONS
        // ============================================================
        // All available options with descriptions and default values
        // Remove or comment out options you don't need (defaults will be used)

        const chart = new FCSAPIChart({
            // REQUIRED SETTINGS
            // HTML & AUTHENTICATION
            container: document.getElementById('fcs_chart'), // Required: Chart container element
            parentid: 'fcs_chartparent',                     // Required: Parent container ID for toolbar/sidebar
            // accessKey: 'yourKey',                     //   Leave empty or comment if want to use free chart            // Your API access key (get from fcsapi.com)
            // publicKey: 'your_public_key',     // ENTER YOUR PUBLIC KEY TO Hide ACCESSkeY IN  user network                // Your API access key (get from fcsapi.com)
            
            //Websocket key is limited to 2second update and limited connection per IP, for faster udpate and more connection you need to purcahse it.
            //socketApiKey: 'vunelix_widget',             // WebSocket API key for live data

            //socketUrl: 'ws://localhost:4001/ws', // Custom WebSocket URL (optional)

            // ========================================
            // CORE CHART SETTINGS
            symbol: 'BINANCE:BTCUSDT',            // Default symbol to load (format: EXCHANGE:SYMBOL)
            period: '1H',                         // Default timeframe: 1m, 5m, 15m, 30m, 1h, 4h, 1D, 1W, 1M
            length: 600,                          // Number of candles to load (max depends on API plan)
            enableCache: true,                    // Cache user's last symbol/period/settings in localStorage
            changeURL: true,                     // Update browser URL with symbol/period (shareable links)

            // ========================================
            // DISPLAY MODE
            displayMode: 'normal',                // 'normal' = full UI | 'chartonly' = hide all UI except chart

            // ========================================
            // CHART APPEARANCE
            theme: 'light',                        // 'dark' | 'light'
            defaultChartType: 'candlestick',      // candlestick | bars | line | area | hollow | heikin-ashi | high-low | volume-candles

            // ========================================
            // UI LAYOUT TOGGLES
            enableSidebar: true,                  // Left sidebar with drawing tools
            enableToolbar: true,                  // Top toolbar with all controls
            enableRangeSelector: true,            // Bottom time range selector bar

            // ========================================
            // SYMBOL SEARCH FILTERS
            // Control which tabs and symbols appear in search modal
            // Tabs keys: 'fav','forex', 'crypto','commodity', 'stock','dr', 'fund', 'futures', 'indices', 'dex'
            // searchModalTabs: {'fav':'Fav','all':'All List','forex':'Forex', 'crypto':'Crypto','commodity':'commodity','stock':'Stocks', 'fund':'Funds', 'futures':'Future', 'indices':'Indicies','dex':'Dex','dr':'Depositary Receipts'},           // Only show these tabs (null = all)
            // searchAllowSymbols: ['BINANCE:BTCUSDT', 'ONA:EURUSD'],  // Only these symbols appear in results (null = all)
            // searchExcludeSymbols: ['BINANCE:DOGEUSDT'],     // Hide these symbols from results (null = none)
            searchModalTabs: {'fav':'Fav','all':'All List','forex':'Forex', 'crypto':'Crypto','stock':'Stocks','dr':'Drs', 'fund':'Funds', 'futures':'Future', 'indices':'Indicies','dex':'Dex'},  
            // ========================================
            // TOOLBAR  CONTROLS
            enableSearch: true,                   // Symbol search button
            enableIndicators: true,               // Indicators button and panel
            enableMultiChart: true,               // Multi-chart layouts button
            enableReplay: true,                   // Replay mode button and functionality
            enableCapture: true,                  // Screenshot/export button
            enableUndoRedo: true,                 // Undo/Redo buttons (Ctrl+Z, Ctrl+Y)
            enableTemplates: true,                // Template save/load functionality
            enableSettings: true,                 // Settings gear button
            enableSymbolInfo: true,               // Symbol info button (shows profile/stats)
            enableChartTypeSelector: true,        // Chart type dropdown selector
            enableTimeframeSelector: true,        // Timeframe/period dropdown selector
            displayExchangeName:true,               // when false: Hide exchange name from info overlay
            
            // ========================================
            // CHART FEATURES
            // ========================================
            enableSocket: true,                   // WebSocket for live price updates
            enableContextMenu: true,              // Right-click context menu
            enableDrawingTools: true,             // Drawing tools functionality

            // ========================================
            // GRID & CROSSHAIR
            enableGrid: false,                    // Show grid lines on chart
            enableCrosshair: true,                // Show crosshair on mouse hover
            enableCrosshairLabels: true,          // Show price/time labels on crosshair

            // ========================================
            // PRICE LABELS & LINES
            enablePriceLine: true,                // Current price horizontal line and label
            enableAskBidLines: false,              // Ask/Bid price lines (requires socket)
            enableAskPriceLabels: true,           // Ask price label on price axis
            enableBidPriceLabels: true,           // Bid price label on price axis
            enableHighLowLabels: true,            // High/Low price labels on chart

            // ========================================
            // INDICATOR SETTINGS
            enableIndicatorLabels: true,          // Show indicator name labels on chart
            enableOHLCBar: true,                  // Show OHLC values bar (top-left)

            // ========================================
            // PRICE LABEL COLORS (hex values)
            askLabelColor: '#00bcd4',             // Ask price label color (cyan)
            bidLabelColor: '#ff9800',             // Bid price label color (orange)
            lastPriceLabelColor: null,            // Last price label (null = use candle up/down color)

            // ========================================
            // INDICATOR PANEL SETTINGS
            indicatorPanelBgColor: null,          // Panel background (null = use chart theme background)

            // ========================================
            // SCALE SETTINGS
            autoScale: true,                      // Auto-scale price verticle axis to visible data
            logScale: false,                      // Logarithmic price scale

            // ========================================
            // DRAWING SETTINGS
            // ========================================
            defaultMagnetMode: false,             // Default false, state of magnet mode for better user experience

            // ========================================
            // TIMEZONE
            // ========================================
            timezone: 'local',                    // 'local' | 'UTC' | '+05:00' | '-08:00' etc.

        });

        // ============================================================
        // API METHODS REFERENCE
        // ============================================================
        // Use these methods to control the chart programmatically

        // --- Symbol & Period ---
        // chart.setSymbol('NASDAQ:AAPL');       // Change symbol (format: EXCHANGE:SYMBOL)
        // chart.setSymbol('FX:EURUSD');         // Forex example
        // chart.setSymbol('BINANCE:ETHUSDT');   // Crypto example
        // chart.setPeriod('4H');                // Change timeframe
        // chart.setPeriod('1D');                // Daily timeframe

        // --- Theme & Chart Type ---
        // chart.setTheme('light');              // Switch to light theme
        // chart.setTheme('dark');               // Switch to dark theme
        // chart.setChartType('line');           // Line chart
        // chart.setChartType('area');           // Area chart
        // chart.setChartType('heikin-ashi');    // Heikin-Ashi candles
        // chart.setChartType('bars');           // OHLC bars
        // chart.setChartType('renko');          // Renko bricks

        // --- Export ---
        // const imageData = chart.exportImage(); // Get chart as base64 PNG
        // Download example:
        // const link = document.createElement('a');
        // link.download = 'chart.png';
        // link.href = chart.exportImage();
        // link.click();

        // --- Resize ---
        // chart.resize();                       // Recalculate dimensions after container resize

        // --- Cleanup ---
        // chart.destroy();                      // Remove chart and cleanup resources

        // ============================================================
        // HORIZONTAL LINE API (for Brokers - TP/SL/Entry lines)
        // ============================================================
        // Add Take Profit line
        // const tpLine = await chart.addHorizontalLine({
        //     price: 45000,
        //     color: '#4caf50',
        //     label: 'TP',
        //     style: 'dashed'
        // });

        // Add Stop Loss line
        // const slLine = await chart.addHorizontalLine({
        //     price: 42000,
        //     color: '#f44336',
        //     label: 'SL',
        //     style: 'dashed'
        // });

        // Add Entry line
        // const entryLine = await chart.addHorizontalLine({
        //     price: 43500,
        //     color: '#2196f3',
        //     label: 'Entry',
        //     style: 'solid',
        //     lineWidth: 2
        // });

        // Update line price
        // chart.updateHorizontalLine(tpLine, { price: 46000 });

        // Remove line
        // chart.removeHorizontalLine(tpLine);

        // Get all lines
        // const lines = chart.getHorizontalLines();

        // Clear all lines
        // chart.clearHorizontalLines();


        // ============================================================
        // TRADIGY V1 — Vertical Zoom Control Layer
        // ============================================================
        (() => {
            const controls = document.getElementById('tradigyVerticalZoom');
            const up = document.getElementById('vzUp');
            const down = document.getElementById('vzDown');
            const auto = document.getElementById('vzAuto');
            const lock = document.getElementById('vzLock');

            if (!controls || !up || !down || !auto || !lock) return;

            // Keep the controls anchored to the actual FCS price-chart area.
            const mountControls = () => {
                const priceArea = document.querySelector('#fcs_chart .fcsapi-chart-area');
                if (priceArea && controls.parentElement !== priceArea) {
                    priceArea.appendChild(controls);
                }
            };
            mountControls();
            window.setTimeout(mountControls, 0);
            window.setTimeout(mountControls, 250);

            const getEngine = () => chart && chart.engine;
            const getState = () => {
                const engine = getEngine();
                return engine && engine.data && engine.priceRange ? engine : null;
            };

            const syncState = () => {
                const engine = getState();
                if (!engine) return;
                lock.classList.toggle('active', engine.autoScale === false);
                auto.classList.toggle('active', engine.autoScale !== false);
            };

            const zoomVertical = (zoomIn) => {
                const engine = getState();
                if (!engine) return;

                const data = Array.isArray(engine.data) ? engine.data : [];
                if (!data.length) return;

                const lows = data.map(c => Number(c.low)).filter(Number.isFinite);
                const highs = data.map(c => Number(c.high)).filter(Number.isFinite);
                if (!lows.length || !highs.length) return;

                const dataMin = Math.min(...lows);
                const dataMax = Math.max(...highs);
                const fullRange = dataMax - dataMin;
                if (!(fullRange > 0)) return;

                const currentMin = Number(engine.priceRange.min);
                const currentMax = Number(engine.priceRange.max);
                if (!Number.isFinite(currentMin) || !Number.isFinite(currentMax) || currentMax <= currentMin) return;

                // Match FCS handleWheel behavior: shrink/expand the current price range.
                const factor = zoomIn ? 0.9 : 1.1;
                const center = (currentMin + currentMax) / 2;
                const nextRange = (currentMax - currentMin) * factor;

                if (nextRange < fullRange * 0.01 || nextRange > fullRange * 5) return;

                engine.priceRange.min = center - nextRange / 2;
                engine.priceRange.max = center + nextRange / 2;
                engine.autoScale = false;

                if (typeof engine.render === 'function') engine.render();
                syncState();
            };

            const setAutoScale = () => {
                const engine = getState();
                if (!engine) return;

                engine.autoScale = true;
                if (typeof engine.calculateVisibleRange === 'function') engine.calculateVisibleRange();
                if (typeof engine.calculatePriceRange === 'function') engine.calculatePriceRange();
                if (typeof engine.render === 'function') engine.render();
                syncState();
            };

            const toggleLock = () => {
                const engine = getState();
                if (!engine) return;

                engine.autoScale = engine.autoScale === false;
                if (engine.autoScale && typeof engine.calculatePriceRange === 'function') {
                    engine.calculatePriceRange();
                }
                if (typeof engine.render === 'function') engine.render();
                syncState();
            };

            up.addEventListener('click', () => zoomVertical(true));
            down.addEventListener('click', () => zoomVertical(false));
            auto.addEventListener('click', setAutoScale);
            lock.addEventListener('click', toggleLock);

            const syncTimer = window.setInterval(syncState, 500);
            window.addEventListener('beforeunload', () => window.clearInterval(syncTimer));
            syncState();
        })();

        console.log('Chart initialized:', chart);

        // Debug info after data loads
        setTimeout(() => {
            console.log('=== Chart Debug Info ===');
            console.log('Data length:', chart.engine.data.length);
            console.log('Socket status:', chart.engine.socketManager?.getConnectionStatus());
            console.log('Theme:', chart.engine.themeManager?.currentTheme);
        }, 2000);

    </script>
</body>
</html>
